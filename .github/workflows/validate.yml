name: Scientific validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  python-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy matplotlib openmm torch
      - name: Compile Python syntax
        run: python -m compileall -q 01_equilibrium_sampling 02_umbrella_sampling 03_mbar 04_reaction_coordinates 05_nonequilibrium 07_ramd_theory 08_trajectory_analysis 09_openmm_ramd 10_ml_extension research
      - name: Paper 4 core integrator smoke
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('p4','01_equilibrium_sampling/sampling_integrators.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for step in (.005,.02):
              for func in (m.euler_maruyama,m.modified_colored_noise):
                  a=func(0,step,1000,seed=5)
                  assert len(a)==1000 and all(map(__import__('math').isfinite,a))
          print('Paper 4 smoke passed')
          PY
      - name: Paper 2 to 5 integration
        timeout-minutes: 8
        run: |
          python - <<'PY'
          import runpy, pathlib
          m=runpy.run_path('02_umbrella_sampling/umbrella_sampling.py',run_name='p2')
          m['metropolis_trajectory'](m['potential'],-1,100,.2,__import__('numpy').random.default_rng(1))
          PY
          python 02_umbrella_sampling/umbrella_sampling.py
          python 03_mbar/mbar_analysis.py --max-samples-per-window 500 --bootstrap 2
          python - <<'PY'
          import numpy as np
          x=np.genfromtxt('results_paper5/mbar_pmf.csv',delimiter=',',skip_header=1)
          assert np.isfinite(x[:,1]).all()
          assert abs(np.sum(x[:,1])-1)<.02
          PY
      - name: Paper 3 committor smoke
        run: python 04_reaction_coordinates/committor_analysis.py --shots 5 --max-steps 200 --output /tmp/paper3
      - name: Paper 6 Jarzynski sanity
        run: python 05_nonequilibrium/jarzynski_pulling.py --n-traj 1000 --output /tmp/paper6
      - name: Paper 9 torch autograd
        run: python 10_ml_extension/torchforce_demo.py --check-only --output /tmp/paper9
      - name: Research hypothesis benchmark smoke
        timeout-minutes: 8
        run: python research/memory_rc_validity_benchmark.py --quick --output /tmp/research
      - name: Upload generated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-output
          path: |
            results_paper2/
            results_paper5/
          if-no-files-found: ignore
  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build tauRAMD
        run: g++ -std=c++17 -O2 -Wall -Wextra 06_tau_ramd/tau_ramd.cpp -o /tmp/tau_ramd
      - name: Run tauRAMD smoke
        run: |
          /tmp/tau_ramd 7 2026
          python3 - <<'PY'
          import csv
          with open('tau_ramd_escapes.csv') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==24
          assert all(row['escaped'] in ('0','1') for row in rows)
          PY
  openmm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openmm numpy
      - name: Paper 8 OpenMM toy smoke
        run: python 09_openmm_ramd/openmm_ramd.py --replicas 2 --steps 200 --check-steps 20 --platform Reference --output /tmp/paper8
