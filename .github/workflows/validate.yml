name: Scientific validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  python-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy matplotlib openmm torch MDAnalysis
      - name: Compile Python syntax
        run: python -m compileall -q 01_equilibrium_sampling 02_umbrella_sampling 03_mbar 04_reaction_coordinates 05_nonequilibrium 07_ramd_theory 08_trajectory_analysis 09_openmm_ramd 10_ml_extension research tests
      - name: Paper 4 core integrator smoke
        run: |
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('p4','01_equilibrium_sampling/sampling_integrators.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          for step in (.005,.02):
              for func in (m.euler_maruyama,m.modified_colored_noise):
                  a=func(0,step,1000,seed=5)
                  assert len(a)==1000 and all(map(__import__('math').isfinite,a))
          print('Paper 4 smoke passed')
          PY
      - name: Paper 2 to 5 integration
        timeout-minutes: 8
        run: |
          python - <<'PY'
          import runpy, pathlib
          m=runpy.run_path('02_umbrella_sampling/umbrella_sampling.py',run_name='p2')
          m['metropolis_trajectory'](m['potential'],-1,100,.2,__import__('numpy').random.default_rng(1))
          PY
          python 02_umbrella_sampling/umbrella_sampling.py
          python 03_mbar/mbar_analysis.py --max-samples-per-window 500 --bootstrap 2
          python - <<'PY'
          import numpy as np
          x=np.genfromtxt('results_paper5/mbar_pmf.csv',delimiter=',',skip_header=1)
          assert np.isfinite(x[:,1]).all()
          assert abs(np.sum(x[:,1])-1)<.02
          PY
      - name: Validate WHAM and MBAR against analytic toy PMF
        run: python tests/scientific_checks.py
      - name: Paper 1 RAMD theory smoke
        run: python 07_ramd_theory/ramd_effective_dynamics.py --quick --output /tmp/paper1
      - name: MDAnalysis dependency import
        run: python -c 'import MDAnalysis; print("MDAnalysis import OK")'
      - name: Paper 3 committor smoke
        run: python 04_reaction_coordinates/committor_analysis.py --shots 5 --max-steps 200 --output /tmp/paper3
      - name: Paper 6 Jarzynski sanity
        run: python 05_nonequilibrium/jarzynski_pulling.py --n-traj 1000 --output /tmp/paper6
      - name: Paper 9 torch autograd
        run: python 10_ml_extension/torchforce_demo.py --check-only --output /tmp/paper9
      - name: Research hypothesis benchmark smoke
        timeout-minutes: 8
        run: python research/memory_rc_validity_benchmark.py --quick --output /tmp/research
      - name: Feedback direction-protocol tests
        run: python -m unittest discover -s tests -p 'test_feedback_protocol.py' -v
      - name: Feedback vs exponential comparison (CI smoke only)
        run: python research/feedback_vs_exponential.py --quick --output results_feedback
      - name: Feedback sensitivity grid unit tests
        run: python -m unittest discover -s tests -p 'test_feedback_sensitivity_scan.py' -v
      - name: Feedback sensitivity grid (CI smoke, not a convergence study)
        run: python research/feedback_sensitivity_scan.py --quick --output results_feedback_sweep
      - name: Checkpoint-randomized control regression tests
        run: python -m unittest discover -s tests -p 'test_randomized_checkpoint_control.py' -v
      - name: Three-protocol checkpoint control (CI smoke only)
        run: python research/checkpoint_randomized_control.py --quick --output results_checkpoint_control
      - name: State-conditioned switching regression tests
        run: python -m unittest discover -s tests -p 'test_state_conditioned_switching.py' -v
      - name: State-conditioned switching held-out seed smoke
        run: python research/state_conditioned_switching.py --quick --output results_state_switch
      - name: Frozen cross-landscape switching and kinetic checks
        run: python -m unittest discover -s tests -p 'test_heldout_kinetic_reliability.py' -v
      - name: Held-out landscape kinetic study (CI smoke only)
        run: python research/heldout_kinetic_reliability.py --quick --output results_heldout_quick
      - name: Different potential shapes and Gaussian path ratio tests
        run: python -m unittest discover -s tests -p 'test_topology_girsanov_benchmark.py' -v
      - name: Cross-topology reweighting smoke (not scientific convergence)
        run: python research/topology_girsanov_benchmark.py --quick --output results_topology_quick
      - name: Upload generated results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-python-output
          path: |
            results_paper2/
            results_paper5/
            results_paper1/
            results_feedback/
            results_feedback_sweep/
            results_checkpoint_control/
            results_state_switch/
            results_heldout_quick/
            results_topology_quick/
          if-no-files-found: ignore
  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build tauRAMD
        run: g++ -std=c++17 -O2 -Wall -Wextra 06_tau_ramd/tau_ramd.cpp -o /tmp/tau_ramd
      - name: Run tauRAMD smoke
        run: |
          /tmp/tau_ramd 7 2026
          python3 - <<'PY'
          import csv
          with open('tau_ramd_escapes.csv') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==24
          assert all(row['escaped'] in ('0','1') for row in rows)
          PY
  openmm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openmm numpy
      - name: Paper 8 OpenMM toy smoke
        run: python 09_openmm_ramd/openmm_ramd.py --replicas 2 --steps 200 --check-steps 20 --platform Reference --output /tmp/paper8

  heldout-physics-pilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: pip install numpy matplotlib
      - name: Run exploratory held-out-landscape study
        run: python research/heldout_kinetic_reliability.py --replicas 72 --horizon 80 --output results_heldout_pilot
      - name: Archive pilot results and frozen model coefficients
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-kinetic-pilot
          path: results_heldout_pilot/
          if-no-files-found: warn

  topology-physics-pilot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical requirements
        run: pip install numpy matplotlib
      - name: Run different-topology and path-weighting exploratory pilot
        run: python research/topology_girsanov_benchmark.py --output results_topology_pilot
      - name: Archive full numerical output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-girsanov-pilot
          path: results_topology_pilot/
          if-no-files-found: warn
